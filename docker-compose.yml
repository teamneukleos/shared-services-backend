services:
  postgres:
    image: postgres:17-alpine
    container_name: neukleos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neukleos
      POSTGRES_PASSWORD: neukleos
      POSTGRES_DB: neukleos_erp
    ports:
      - "5432:5432"
    volumes:
      - neukleos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neukleos -d neukleos_erp"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  neukleos_pg_data:
